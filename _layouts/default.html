<!DOCTYPE html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon-32.png' | relative_url }}" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#800040">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body class="theme-{{ page.theme | default: 'papier' }} grain">
  <header class="bandeau">
    <a class="marque" href="{{ '/' | relative_url }}"><b>P</b>aris 7 <b>E</b>n <b>L</b>utte</a>
    <nav>
      <a href="{{ '/ressources/' | relative_url }}">Ressources</a>
      <a href="{{ '/communiques/' | relative_url }}">Communiqués</a>
      <a href="{{ '/agenda/' | relative_url }}">Agenda</a>
      <a href="{{ '/universite-populaire/' | relative_url }}">Université populaire</a>
      <a href="{{ '/a-propos/' | relative_url }}">À propos</a>
    </nav>
    <a class="pastille" href="{{ '/' | relative_url }}" title="Accueil · {{ site.title }}"><img src="{{ '/assets/logo-paris-cite.png' | relative_url }}" alt="Accueil"></a>
  </header>
  <main class="contenu">
    {{ content }}
  </main>
  <footer class="pied">
    <p>{{ site.author }} · <a href="mailto:{{ site.email_contact }}">{{ site.email_contact }}</a> · <a href="{{ '/a-propos/' | relative_url }}#inscription">S'abonner</a> · <a href="{{ '/confidentialite/' | relative_url }}">Mentions légales</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>
</body>
</html>
