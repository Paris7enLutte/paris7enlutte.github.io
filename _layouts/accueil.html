<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon-32.png' | relative_url }}" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#800040">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body class="theme-accueil grain">
  <main class="accueil">
    <nav class="disques" aria-label="Navigation principale">
      <a class="disque disque--ocre" href="{{ '/ressources/' | relative_url }}" style="--x:6%;--y:8%;--d:min(34vw,300px)"><span>Ressources</span></a>
      <a class="disque disque--bleu" href="{{ '/communiques/' | relative_url }}" style="--x:30%;--y:34%;--d:min(26vw,230px)"><span>Communiqués</span></a>
      <a class="disque disque--rouge" href="{{ '/agenda/' | relative_url }}" style="--x:9%;--y:64%;--d:min(22vw,200px)"><span>Agenda</span></a>
      <a class="disque disque--noir" href="{{ '/a-propos/' | relative_url }}" style="--x:80%;--y:6%;--d:min(17vw,150px)"><span>À propos</span></a>
      <a class="disque disque--up" href="{{ '/universite-populaire/' | relative_url }}" style="--x:33%;--y:70%;--d:min(18vw,175px)"><span>Université populaire</span></a>
    </nav>
    <div class="accueil-titre">
      <img class="logo-univ" src="{{ '/assets/logo-paris-cite.png' | relative_url }}" alt="Université Paris Cité">
      <h1 class="titre-lbd" aria-label="{{ site.title }}"><span><b>P</b>aris 7</span><span><b>E</b>n</span><span><b>L</b>utte</span></h1>
      <p>{{ site.description }}</p>
      <p class="accueil-abonner"><a href="{{ '/a-propos/' | relative_url }}#inscription">Recevoir la lettre par courriel</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
      <p class="accueil-abonner">Contact : <a href="mailto:{{ site.email_contact }}">{{ site.email_contact }}</a></p>
    </div>
  </main>
</body>
</html>
